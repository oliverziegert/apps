name: smtp-relay
services:
  # NetBird agent that owns the stack's network namespace. Its 0.0.0.0/0 route
  # (exit node on the OVH VPS) carries Postfix's outbound delivery, so mail
  # leaves from 141.95.41.247 rather than the home line. See README.md.
  #
  # Deliberately not cap_drop: [ALL] - the agent creates the WireGuard
  # interface and installs routes and nftables rules, which needs NET_ADMIN,
  # SYS_RESOURCE and /dev/net/tun. Postfix shares the namespace but not
  # these capabilities.
  netbird:
    image: netbirdio/netbird:0.80.0
    restart: unless-stopped
    environment:
      NB_SETUP_KEY: ${NB_SETUP_KEY}
      NB_MANAGEMENT_URL: https://netbird.pc-ziegert.dev
      NB_HOSTNAME: smtp-relay
    cap_add:
      - NET_ADMIN
      - SYS_RESOURCE
    devices:
      - /dev/net/tun
    security_opt:
      - no-new-privileges
    volumes:
      # Enrolled identity. Must persist, or every restart enrolls a new peer.
      - type: bind
        source: ${VOLUME_NETBIRD_SRC}
        target: ${VOLUME_NETBIRD_DST}
        read_only: false
    # Postfix has no endpoint of its own on reverse-proxy any more, so this
    # one answers for it. The aliases keep both names the apps could have
    # configured as their SMTP host resolving: the service name and the old
    # container name.
    networks:
      reverse-proxy:
        aliases:
          - postfix-relay
          - smtp-relay-postfix-relay-1

  postfix-relay:
    image: mwader/postfix-relay:1.2.17
    restart: unless-stopped
    network_mode: service:netbird
    depends_on:
      - netbird
    environment:
      TZ: Europe/Berlin
      OPENDKIM_DOMAINS: ${OPENDKIM_DOMAINS}
      POSTFIX_mydestination: 'localhost'
      POSTFIX_myhostname: ${POSTFIX_MYHOSTNAME}
      # Only loopback and the reverse-proxy network (both families) may relay.
      # Mail leaves from the VPN's control-plane address, so an open relay
      # risks the whole VPN; NetBird overlay sources must stay outside this.
      POSTFIX_mynetworks: 127.0.0.0/8 [::1]/128 172.16.2.0/24 [fdd0:0:0:2::]/64
      # Direct-to-MX delivery from smtp-out.pc-ziegert.de (141.95.41.247,
      # matching PTR) through the netbird sidecar's exit-node route.
      POSTFIX_relayhost: ''
      POSTFIX_smtp_helo_name: smtp-out.pc-ziegert.de
      # Listener is dual-stack (apps connect over IPv6 on reverse-proxy), but
      # delivery is IPv4-only: the exit node routes IPv4, and only that
      # address has FCrDNS and SPF.
      POSTFIX_inet_protocols: all
      POSTFIXMASTER_smtp__unix: smtp unix - - n - - smtp -o inet_protocols=ipv4
      POSTFIX_smtp_sasl_security_options: noanonymous
      POSTFIX_smtp_sasl_tls_security_options: noanonymous
      # Opportunistic TLS, the norm for MX delivery; encrypt would defer mail
      # to MX hosts without STARTTLS.
      POSTFIX_smtp_tls_security_level: may
      POSTFIX_smtp_use_tls: 'yes'
      POSTFIX_smtp_tls_cert_file: /etc/pki/tls/certs/tls.crt
      POSTFIX_smtp_tls_key_file: /etc/pki/tls/private/tls.key
      POSTFIX_smtpd_tls_cert_file: /etc/pki/tls/certs/tls.crt
      POSTFIX_smtpd_tls_key_file: /etc/pki/tls/private/tls.key
      POSTFIX_smtpd_tls_security_level: may
      POSTFIX_transport_maps: 'hash:/etc/postfix/transport'
      POSTMAP_transport: 'mail@localhost discard:'
    secrets:
      - source: tls_cert
        target: /etc/pki/tls/certs/tls.crt
      - source: tls_key
        target: /etc/pki/tls/private/tls.key
    volumes:
      - type: bind
        source: ${VOLUME_DATA_SRC}
        target: ${VOLUME_DATA_DST}
        read_only: false
      - type: bind
        source: ${VOLUME_MAIL_SRC}
        target: ${VOLUME_MAIL_DST}
        read_only: false
      - type: bind
        source: ${VOLUME_SPOOL_SRC}
        target: ${VOLUME_SPOOL_DST}
        read_only: false
      - type: bind
        source: ${VOLUME_DKIM_SRC}
        target: ${VOLUME_DKIM_DST}
        read_only: false
    healthcheck:
      test:
        - CMD
        - postfix
        - status
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 5s

networks:
  reverse-proxy:
    external: true
    name: reverse-proxy

secrets:
  tls_cert:
    file: ${TLS_CERT}
  tls_key:
    file: ${TLS_KEY}