name: collabora
services:
  collabora:
    image: docker.io/collabora/code:26.04.4.1.1@sha256:1efda3043e8b9cb437d1b6c6efe20cc3753760e634de012b8dac391da488bf97
    restart: unless-stopped
    deploy:
      resources: 
        limits: 
          memory: 4096M
    # Minimum set for coolwsd's jail setup, verified by bisect against this
    # image: dropping any one of these makes forkit die with ECHILD at startup.
    cap_add:
      - CHOWN
      - FOWNER
      - SYS_CHROOT
    cap_drop: 
      - ALL
    # Healthcheck is inherited from the image (coolwsd --probe). Do not pin it
    # here: upstream removed the shell entirely in 26.04, which broke the
    # previous bash/dev-tcp override.
    environment:
      DONT_GEN_SSL_CERT: true
      TZ: Europe/Berlin
      dictionaries: de_DE en_GB en_US es_ES fr_FR it nl pt_BR pt_PT ru
      username: ${COLLABORA_USERNAME}
      password: ${COLLABORA_PASSWORD}
      extra_params: >-
       --o:welcome.enable=false
       --o:user_interface.mode=notebookbar
       --o:ssl.termination=true
       --o:ssl.enable=false
       --o:logging.level=warning
       --o:logging.level_startup=warning
       --o:mount_jail_tree=false
      server_name: ${COLLABORA_SERVER_NAME}
      timezone: Europe/Berlin
    networks:
      - collabora
      - reverse-proxy

networks:
  collabora: {}
  reverse-proxy:
    external: true
    name: reverse-proxy
